<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="personal-llm in one picture: notes are chunked, embedded locally and stored in SQLite and ChromaDB. A question is ranked by 0.6 similarity plus 0.2 importance plus 0.2 recency. If the top-ranked hit has similarity below 0.25 the engine answers that it has nothing in memory; otherwise the router tries local Ollama, then Gemini, and returns an answer with its cited sources. Three apps import this kernel.">
<!--
  ============================================================================
  ORIGINAL WORK - AUTHORSHIP MANIFEST
  ============================================================================
  Title      : personal-llm, answer or refuse.
  Author     : Zaid Ali Syed
  ORCID      : 0009-0003-4313-1510
  Origin     : https://github.com/zaidwhy/personal-llm
  Copyright  : (c) 2026 Zaid Ali Syed. MIT licensed with the repository.

  Every number is read from the code on 2026-09-27:
  rank weights  src/personal_llm/memory/retrieve.py
  0.25 floor    src/personal_llm/config.py, retrieval_min_similarity
  30 day decay  src/personal_llm/config.py, memory_recency_half_life_days
  Ollama first  src/personal_llm/router/router.py, default provider order
  188 tests     pytest, 188 passed, 2026-09-27

  Hand-authored artwork. Animation degrades gracefully: static attribute
  values are the finished state.
  ============================================================================
-->
<defs>
<clipPath id="pl-clip"><rect x="0" y="0" width="900" height="430" rx="10"/></clipPath>
<path id="pl-q" d="M232 250 H 300" fill="none"/>
<path id="pl-yes" d="M560 226 C 590 226, 590 170, 620 170" fill="none"/>
<path id="pl-no" d="M560 274 C 590 274, 590 318, 620 318" fill="none"/>
</defs>

<g clip-path="url(#pl-clip)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
<rect x="0" y="0" width="900" height="430" fill="#0B0E14"/>

<text x="40" y="36" fill="#E9EEF5" font-size="17" font-weight="700" letter-spacing="1.6">ANSWER, OR SAY IT ISN'T THERE</text>
<text x="40" y="57" fill="#7D8794" font-size="11.5">A memory kernel that cites its sources, and refuses when the memory is not strong enough to cite.</text>

<!-- memory -->
<rect x="40" y="88" width="192" height="116" rx="8" fill="#0E141C" stroke="#1B2430" stroke-width="1.5"/>
<text x="56" y="112" fill="#E9EEF5" font-size="12.5" font-weight="700">memory</text>
<text x="56" y="134" fill="#9AA5B1" font-size="10.5">notes, md, pdf -&gt; chunks</text>
<text x="56" y="152" fill="#9AA5B1" font-size="10.5">embedded locally</text>
<text x="56" y="170" fill="#7D8794" font-size="10.5">SQLite  rows + audit</text>
<text x="56" y="188" fill="#7D8794" font-size="10.5">ChromaDB  vectors</text>

<path d="M136 204 V 222" stroke="#2A3542" stroke-width="1.5"/>

<rect x="40" y="222" width="192" height="56" rx="8" fill="#0E141C" stroke="#1B2430" stroke-width="1.5"/>
<text x="56" y="246" fill="#E9EEF5" font-size="12.5" font-weight="700">a question</text>
<text x="56" y="265" fill="#7D8794" font-size="10.5">"what did I decide?"</text>

<!-- rank + gate -->
<g stroke="#2A3542" stroke-width="1.5" fill="none"><use href="#pl-q"/><use href="#pl-yes"/><use href="#pl-no"/></g>

<rect x="300" y="200" width="260" height="100" rx="8" fill="#0E1720" stroke="#22D3EE" stroke-width="2"/>
<text x="316" y="224" fill="#22D3EE" font-size="12.5" font-weight="700">rank, then gate</text>
<text x="316" y="246" fill="#E9EEF5" font-size="10.5">0.6 similarity</text>
<text x="316" y="262" fill="#E9EEF5" font-size="10.5">+ 0.2 importance + 0.2 recency</text>
<text x="316" y="284" fill="#9AA5B1" font-size="10.5">top hit similarity &lt; 0.25 ?</text>

<text x="584" y="188" fill="#4A5563" font-size="10">no</text>
<text x="584" y="318" fill="#4A5563" font-size="10">yes</text>

<!-- grounded answer -->
<rect x="620" y="118" width="250" height="104" rx="8" fill="#0E141C" stroke="#1B2430" stroke-width="1.5"/>
<text x="636" y="142" fill="#E9EEF5" font-size="12.5" font-weight="700">grounded answer</text>
<text x="636" y="163" fill="#9AA5B1" font-size="10.5">router: Ollama (local) first,</text>
<text x="636" y="179" fill="#9AA5B1" font-size="10.5">Gemini if Ollama is down</text>
<text x="636" y="204" fill="#22D3EE" font-size="10.5">answer + cited sources</text>

<!-- refusal -->
<rect x="620" y="290" width="250" height="60" rx="8" fill="#170E10" stroke="#F87171" stroke-width="1.5"/>
<text x="636" y="314" fill="#F87171" font-size="11" font-weight="700">"I don't have anything in</text>
<text x="636" y="331" fill="#F87171" font-size="11" font-weight="700">memory about that."</text>

<g>
<circle r="3.5" fill="#22D3EE"><animateMotion dur="3.2s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1"><mpath href="#pl-q"/></animateMotion></circle>
<circle r="3.5" fill="#22D3EE"><animateMotion dur="3.2s" begin="0.8s" repeatCount="indefinite"><mpath href="#pl-yes"/></animateMotion></circle>
<circle r="3.5" fill="#F87171"><animateMotion dur="3.2s" begin="2.2s" repeatCount="indefinite"><mpath href="#pl-no"/></animateMotion></circle>
</g>

<!-- imported by -->
<text x="40" y="374" fill="#E9EEF5" font-size="11.5">imported, not rebuilt, by second-brain · github-pr-agent · dreamos-command-bar</text>
<text x="40" y="392" fill="#7D8794" font-size="10.5">188 tests, offline and mocked: no key, network or real model runs any of them</text>

<rect x="0" y="406" width="900" height="24" fill="#070A0F"/>
<text x="40" y="422" fill="#4A5563" font-size="10" letter-spacing="2.2">PERSONAL-LLM  ·  ORIGINAL WORK OF ZAID ALI SYED  ·  ORCID 0009-0003-4313-1510  ·  MMXXVI</text>
</g>
</svg>
